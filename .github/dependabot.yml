version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Collapse the weekly minor/patch churn into a single rolling PR
    # instead of one PR per package.
    groups:
      # vitest and @vitest/* peer-pin each other to the exact same version,
      # so they must always move in one PR. Listed first: Dependabot places
      # a dependency in the first group that matches. Majors are still
      # blocked by the ignore rule below; when one is let through, the pair
      # lands together instead of as split, individually-failing PRs.
      vitest:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["major", "minor", "patch"]
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Supply-chain delay: don't propose an update until the new version
    # has been published for at least 3 days. Mitigates auto-merging a
    # freshly-published malicious release.
    cooldown:
      semver-minor-days: 3
      semver-patch-days: 3
    # Majors always require a human; never auto-bumped or auto-merged.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Keep the SHA-pinned action refs current (with changelogs) now that
    # sha_pinning_required is enforced. One rolling PR for minor/patch.
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    cooldown:
      semver-minor-days: 3
      semver-patch-days: 3
    # Major action bumps stay human-reviewed.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
