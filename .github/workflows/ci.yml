name: CI

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 15
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Inline Tactic #146 provenance gate: cisco-axl-mcp is a public repository and cannot
      # reference private calltelemetry/github-actions composite actions.
      - name: Provenance fast-path
        id: provenance
        if: github.event_name == 'push' || github.event_name == 'merge_group'
        env:
          CHECK_NAME: test
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MG_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_PATHS: '^(\.github/workflows/|package\.json|yarn\.lock|\.yarnrc\.yml|tsconfig.*\.json|vitest\.config\.ts|vite\.config\.ts|eslint\.config\.js)'
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          head_tree="$(git rev-parse 'HEAD^{tree}')"
          proven=false
          reason=unproven

          has_green() {
            [[ -n "${1:-}" ]] || return 1
            local api_out
            if ! api_out="$(gh api "repos/${REPO}/commits/${1}/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"${CHECK_NAME}\" and .status == \"completed\" and .conclusion == \"success\")] | length > 0" 2>&1)"; then
              echo "::warning title=PR provenance::check-runs lookup failed for ${1:0:7}: ${api_out}" >&2
              return 1
            fi
            [[ "$api_out" == "true" ]]
          }

          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            queue_base="$(git rev-parse --verify HEAD^1 2>/dev/null || true)"
            pr_head="$(git rev-parse --verify HEAD^2 2>/dev/null || true)"
            if [[ "$pr_head" =~ ^[0-9a-f]{40}$ ]]; then
              pr_tree="$(git rev-parse --verify "${pr_head}^{tree}" 2>/dev/null || true)"
              mode=""
              if [[ "$head_tree" == "$pr_tree" ]]; then
                mode="exact"
              elif [[ "$queue_base" =~ ^[0-9a-f]{40}$ ]]; then
                pr_base="$(git merge-base "$queue_base" "$pr_head" 2>/dev/null || true)"
                if [[ -z "$pr_base" ]]; then
                  git fetch --no-tags --filter=blob:none --deepen=2000 origin >/dev/null 2>&1 || true
                  pr_base="$(git merge-base "$queue_base" "$pr_head" 2>/dev/null || true)"
                fi
                if [[ "$pr_base" =~ ^[0-9a-f]{40}$ ]]; then
                  drift="$(git diff --no-renames --name-only "$pr_base" "$queue_base" 2>/dev/null || true)"
                  pr_changed="$(git diff --no-renames --name-only "$pr_base" "$pr_head" 2>/dev/null || true)"
                  if [[ -z "$drift" ]]; then
                    mode="disjoint-base-drift"
                  elif ! printf '%s\n' "$drift" | grep -qE "${MERGE_GROUP_PATHS}"; then
                    overlap="$(comm -12 <(printf '%s\n' "$drift" | LC_ALL=C sort -u) <(printf '%s\n' "$pr_changed" | LC_ALL=C sort -u))"
                    [[ -z "$overlap" ]] && mode="disjoint-base-drift"
                  fi
                fi
              fi
              if [[ -n "$mode" ]] && has_green "$pr_head"; then
                proven=true
                reason="merge-group-${mode}:${pr_head:0:7}"
              fi
            elif [[ "${MG_HEAD_REF:-}" =~ ^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)- ]]; then
              pr_num="${BASH_REMATCH[1]}"
              squash_fail=""
              pr_json="$(gh api "repos/${REPO}/pulls/${pr_num}" 2>/dev/null || true)"
              if [[ -z "$pr_json" ]]; then
                squash_fail="PR #${pr_num} lookup failed"
              else
                pr_meta="$(jq -r '[if .draft == false then "false" elif .draft == true then "true" else "invalid" end, (.head.sha // ""), (.base.sha // "")] | @tsv' <<<"$pr_json" 2>/dev/null || true)"
                pr_draft="" pr_head="" pr_base=""
                IFS=$'\t' read -r pr_draft pr_head pr_base <<<"$pr_meta"
                if [[ "$pr_draft" != "false" ]]; then
                  squash_fail="PR #${pr_num} draft state invalid (${pr_draft:-empty})"
                elif [[ ! "$pr_head" =~ ^[0-9a-f]{40}$ || ! "$pr_base" =~ ^[0-9a-f]{40}$ ]]; then
                  squash_fail="PR #${pr_num} invalid head/base SHA"
                elif ! has_green "$pr_head"; then
                  squash_fail="PR #${pr_num} (${pr_head:0:7}) lacks green ${CHECK_NAME}"
                elif [[ ! "$queue_base" =~ ^[0-9a-f]{40}$ ]]; then
                  squash_fail="missing valid HEAD^1 queue_base"
                fi
              fi

              if [[ -z "$squash_fail" ]]; then
                pr_files="$(gh api "repos/${REPO}/pulls/${pr_num}/files" --paginate --jq '.[] | "\(.filename // "")\t\(.status // "")\t\(.sha // "")"' 2>/dev/null | sed '/^$/d' | LC_ALL=C sort || true)"
                mg_cmp="$(gh api "repos/${REPO}/compare/${queue_base}...${head_sha}" 2>/dev/null || true)"
                mg_files="$(jq -r 'if (.files | type) == "array" and (.files | length) > 0 and (.files | length) < 300 then (.files[] | "\(.filename // "")\t\(.status // "")\t\(.sha // "")") else empty end' <<<"$mg_cmp" 2>/dev/null | sed '/^$/d' | LC_ALL=C sort || true)"
                if [[ -z "$pr_files" || -z "$mg_files" || "$pr_files" != "$mg_files" ]]; then
                  squash_fail="file-blob identity mismatch"
                elif [[ "$pr_base" == "$queue_base" ]]; then
                  proven=true
                  reason="merge-group-exact:${pr_head:0:7}"
                else
                  base_cmp="$(gh api "repos/${REPO}/compare/${pr_base}...${queue_base}" 2>/dev/null || true)"
                  base_status="$(jq -r '.status // ""' <<<"$base_cmp" 2>/dev/null || true)"
                  base_count="$(jq -r 'if .files == null then 0 elif (.files | type) == "array" then (.files | length) else 300 end' <<<"$base_cmp" 2>/dev/null || echo 300)"
                  if [[ "$base_status" == "ahead" || "$base_status" == "identical" ]] && [[ "$base_count" -lt 300 ]]; then
                    drift="$(jq -r '.files[]? | .filename, (.previous_filename // empty)' <<<"$base_cmp" 2>/dev/null | sed '/^$/d' | LC_ALL=C sort -u || true)"
                    pr_changed="$(printf '%s\n' "$pr_files" | cut -f1 | LC_ALL=C sort -u)"
                    if [[ -z "$drift" ]] || { ! printf '%s\n' "$drift" | grep -qE "${MERGE_GROUP_PATHS}" && [[ -z "$(comm -12 <(printf '%s\n' "$drift") <(printf '%s\n' "$pr_changed"))" ]]; }; then
                      proven=true
                      reason="merge-group-disjoint-base-drift:${pr_head:0:7}"
                    else
                      squash_fail="base drift hits global paths or overlaps PR"
                    fi
                  else
                    squash_fail="base compare invalid (${base_status:-empty}, files=${base_count})"
                  fi
                fi
              fi
              if [[ -n "$squash_fail" ]]; then
                echo "::notice title=PR provenance::squash merge_group fail-closed (${squash_fail})." >&2
              fi
            fi
          fi

          if [[ "$proven" == "false" ]]; then
            pr_heads="$(gh api "repos/${REPO}/commits/${head_sha}/pulls" --jq '.[].head.sha' 2>/dev/null || true)"
            for cand in $(git rev-parse HEAD HEAD^2 2>/dev/null || git rev-parse HEAD) ${pr_heads}; do
              ct="$(git rev-parse --verify "${cand}^{tree}" 2>/dev/null || gh api "repos/${REPO}/git/commits/${cand}" --jq '.tree.sha' 2>/dev/null || true)"
              if [[ -n "$ct" && "$ct" == "$head_tree" ]] && has_green "$cand"; then
                proven=true
                reason="tree-certified:${cand:0:7}"
                break
              fi
            done
          fi

          echo "proven=${proven}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Fast provenance pass
        if: steps.provenance.outputs.proven == 'true'
        run: echo "Tree certified by PR test (${{ steps.provenance.outputs.reason }}); skipping duplicate execution on ${{ github.event_name }}."

      - name: "Classify changed files (Tactic #126 / #132)"
        id: diff
        if: steps.provenance.outputs.proven != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fast_skip=false
          workflows_changed=false
          release_metadata=false
          base_commit=""
          changed=""

          if [[ "$EVENT_NAME" == "pull_request" && -n "$BASE_REF" ]]; then
            git fetch --no-tags --depth=50 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" 2>/dev/null || true
            base_commit="$(git merge-base "origin/${BASE_REF}" HEAD 2>/dev/null || true)"
            if [[ ! "$base_commit" =~ ^[0-9a-f]{40}$ ]] && git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
              base_commit="$(git rev-parse HEAD^1)"
            fi
            if [[ "$base_commit" =~ ^[0-9a-f]{40}$ ]]; then
              changed="$(git diff --no-renames --name-only "$base_commit" HEAD 2>/dev/null || true)"
            fi
            if [[ -z "$changed" && -n "$PR_NUMBER" ]]; then
              changed="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename, (.previous_filename // empty)' 2>/dev/null | sed '/^$/d' | sort -u || true)"
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=50 origin "$BEFORE_SHA" 2>/dev/null || true
              if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                base_commit="$BEFORE_SHA"
                changed="$(git diff --no-renames --name-only "$base_commit" "$HEAD_SHA" 2>/dev/null || true)"
              else
                changed="$(gh api "repos/${REPO}/compare/${BEFORE_SHA}...${HEAD_SHA}" --jq 'if (.files | length) < 300 then (.files[] | .filename, (.previous_filename // empty)) else empty end' 2>/dev/null | sed '/^$/d' | sort -u || true)"
              fi
            elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              base_commit="$(git rev-parse HEAD~1)"
              changed="$(git diff --no-renames --name-only "$base_commit" HEAD 2>/dev/null || true)"
            fi
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            if git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
              base_commit="$(git rev-parse HEAD^1)"
              changed="$(git diff --no-renames --name-only "$base_commit" HEAD 2>/dev/null || true)"
            fi
          fi

          if [[ -z "$changed" ]]; then
            echo "::notice title=Diff classifier::Changed files empty or unavailable (${EVENT_NAME}); failing open to full validation."
          else
            SAFE_RE='^(\.release-please-manifest\.json|CHANGELOG\.md|README\.md|docs/.*|\.github/workflows/.*)$'
            has_manifest=false
            has_pkg=false
            all_safe=true

            while IFS= read -r f; do
              [[ -n "$f" ]] || continue
              [[ "$f" == ".release-please-manifest.json" ]] && has_manifest=true
              if [[ "$f" == "package.json" ]]; then
                has_pkg=true
                continue
              fi
              if [[ "$f" =~ ^\.github/workflows/.*\.ya?ml$ ]]; then
                workflows_changed=true
              fi
              if [[ ! "$f" =~ $SAFE_RE ]]; then
                all_safe=false
                break
              fi
            done <<< "$changed"

            if [[ "$all_safe" == "true" && "$has_pkg" == "true" ]]; then
              if [[ "$has_manifest" != "true" || -z "$base_commit" ]] || ! git cat-file -e "${base_commit}^{commit}" 2>/dev/null; then
                all_safe=false
              else
                pkg_diff="$(git diff -U0 "$base_commit" HEAD -- package.json 2>/dev/null || true)"
                if [[ -z "$pkg_diff" ]]; then
                  all_safe=false
                else
                  changed_lines="$(printf '%s\n' "$pkg_diff" | grep -E '^[+-]' | grep -vE '^(---|\+\+\+) ' || true)"
                  minus_cnt="$(printf '%s\n' "$changed_lines" | grep -c '^-' || true)"
                  plus_cnt="$(printf '%s\n' "$changed_lines" | grep -c '^\+' || true)"
                  non_version="$(printf '%s\n' "$changed_lines" | grep -vE '^[+-][[:space:]]*"version":[[:space:]]*"[^"]+",?[[:space:]]*$' || true)"
                  if [[ "$minus_cnt" -lt 1 || "$plus_cnt" -lt 1 || -n "$non_version" ]]; then
                    all_safe=false
                  else
                    release_metadata=true
                  fi
                fi
              fi
            elif [[ "$all_safe" == "true" && "$has_manifest" == "true" ]]; then
              release_metadata=true
            fi

            if [[ "$all_safe" == "true" ]]; then
              fast_skip=true
              echo "::notice title=CI fast-path::Skipping yarn install/validate/codecov (workflows_changed=${workflows_changed}, release_metadata=${release_metadata})."
            fi
          fi

          {
            echo "fast_skip=${fast_skip}"
            echo "workflows_changed=${workflows_changed}"
            echo "release_metadata=${release_metadata}"
          } >> "$GITHUB_OUTPUT"

      - name: "Validate release metadata JSON (Tactic #126)"
        if: steps.provenance.outputs.proven != 'true' && steps.diff.outputs.fast_skip == 'true' && steps.diff.outputs.release_metadata == 'true'
        run: |
          set -euo pipefail
          jq empty .release-please-manifest.json package.json
          pkg_ver="$(jq -r '.version' package.json)"
          manifest_ver="$(jq -r '.["."]' .release-please-manifest.json)"
          if [[ -z "$pkg_ver" || "$pkg_ver" != "$manifest_ver" ]]; then
            echo "::error::package.json version ($pkg_ver) does not match .release-please-manifest.json ($manifest_ver)"
            exit 1
          fi
          echo "Validated release-please metadata JSON (version=$pkg_ver)."

      - name: "Validate workflow YAML syntax (Tactic #132)"
        if: steps.provenance.outputs.proven != 'true' && steps.diff.outputs.fast_skip == 'true' && steps.diff.outputs.workflows_changed == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml
          files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          if not files:
              print("No workflow YAML files found", file=sys.stderr)
              sys.exit(1)
          for path in files:
              with open(path, encoding="utf-8") as fh:
                  doc = yaml.safe_load(fh)
              if not isinstance(doc, dict) or "jobs" not in doc:
                  print(f"Invalid workflow structure in {path}", file=sys.stderr)
                  sys.exit(1)
              print(f"YAML OK: {path}")
          PY
          if command -v actionlint >/dev/null 2>&1; then
            actionlint -ignore 'label "blacksmith-2vcpu-ubuntu-2404-arm" is unknown'
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.provenance.outputs.proven != 'true' && steps.diff.outputs.fast_skip != 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        if: steps.provenance.outputs.proven != 'true' && steps.diff.outputs.fast_skip != 'true'
        run: corepack enable

      - name: Restore Yarn Berry cache
        id: yarn-cache
        if: steps.provenance.outputs.proven != 'true' && steps.diff.outputs.fast_skip != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.yarn/berry/cache
            ~/.cache/node/corepack
          key: yarn-berry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-berry-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        if: steps.provenance.outputs.proven != 'true' && steps.diff.outputs.fast_skip != 'true'
        run: yarn install --immutable

      - name: Save Yarn Berry cache
        if: steps.provenance.outputs.proven != 'true' && steps.diff.outputs.fast_skip != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.yarn/berry/cache
            ~/.cache/node/corepack
          key: yarn-berry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

      - name: Validate
        id: validate
        if: steps.provenance.outputs.proven != 'true' && steps.diff.outputs.fast_skip != 'true'
        run: yarn validate

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && (steps.validate.outcome == 'success' || steps.validate.outcome == 'failure') }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
