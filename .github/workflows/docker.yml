name: Build and Push Container

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: "1"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

jobs:
  docker:
    name: Build and push container image
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Blacksmith Docker Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.pkg.outputs.tag }}
            type=raw,value=${{ steps.pkg.outputs.version }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag release in git
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG} [no-linear]"
            git push origin "${TAG}" || true
          fi

      - name: Mint release-automation token for ct-infrastructure
        if: github.ref == 'refs/heads/main'
        id: rel_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: calltelemetry
          repositories: ct-infrastructure
        continue-on-error: true

      - name: Auto-bump deployment in ct-infrastructure
        if: github.ref == 'refs/heads/main' && steps.rel_token.outputs.token != ''
        env:
          INFRA_TOKEN: ${{ steps.rel_token.outputs.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          set -euo pipefail
          TMP_DIR=$(mktemp -d)
          git clone --depth=1 "https://x-access-token:${INFRA_TOKEN}@github.com/calltelemetry/ct-infrastructure.git" "${TMP_DIR}"
          DEPLOY_PATH="${TMP_DIR}/clusters/doks-nyc1/apps/llm-gateway/deploy-cisco-axl-mcp.yaml"
          if [[ -f "${DEPLOY_PATH}" ]]; then
            sed -i.bak -E "s|image: ghcr.io/calltelemetry/cisco-axl-mcp:[^ ]*|image: ghcr.io/calltelemetry/cisco-axl-mcp:${TAG}|g" "${DEPLOY_PATH}"
            rm -f "${DEPLOY_PATH}.bak"
            cd "${TMP_DIR}"
            if ! git diff --quiet; then
              git config user.name "ct-release-automation[bot]"
              git config user.email "ct-release-automation[bot]@users.noreply.github.com"
              git commit -am "chore(llm-gateway): auto-bump cisco-axl-mcp to ${TAG} [skip ci]"
              git push origin main
              echo "Successfully pushed auto-bump to ct-infrastructure main"
            else
              echo "ct-infrastructure already up to date with ${TAG}"
            fi
          fi
          rm -rf "${TMP_DIR}"

      - name: Prune builder cache to budget
        if: always()
        run: docker buildx prune --force --keep-storage 5GB
